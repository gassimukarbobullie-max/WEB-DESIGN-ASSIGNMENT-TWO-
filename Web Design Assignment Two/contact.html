function bindContact(){$("#cf").onsubmit=async e=>{e.preventDefault();const form=e.target;let ok=true;const chk=(i,er,bad,m)=>{$(er).textContent=bad?m:"";if(bad)ok=false};
chk("#cn","#en",!$("#cn").value.trim(),"Enter your name.");chk("#cp","#ep",$("#cp").value&&!/^\+?[\d\s-]{7,15}$/.test($("#cp").value),"Enter a valid phone number, for example +232 76 000 000.");

if(!ok)return;const msg={name:$("#cn").value.trim(),phone:$("#cp").value,who:["Farmer","Buyer","Other"][$$("[name=w]").findIndex(x=>x.checked)],topic:$("#ct").value,text:$("#cm").value.trim(),whatsappCallback:$$("#cf input[type=checkbox]")[0].checked,at:new Date().toISOString()};

function openDetail(id){const l=L.find(x=>x.id==id);if(!l)return;let d=$("#dlg");if(!d){d=document.createElement("dialog");d.id="dlg";document.body.appendChild(d)}

if(!Number.isInteger(q)||q<1)return er.textContent="Enter a whole quantity of 1 or more.";if(q>l.qty)return er.textContent="Only "+l.qty+" "+l.unit+" available.";if(n.length<2)return er.textContent="Enter your name.";
